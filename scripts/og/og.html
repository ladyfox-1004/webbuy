<!doctype html>
<!--
  공유 카드(public/og.png, 1200x630) 원본. scripts/og/render.py 가 이 파일을 캡처한다.
  🚨 문구는 홈 히어로(src/routes/index.tsx Hero)·__root.tsx 의 SHARE_* 와 같은 말을 쓴다.
     숫자·가격·고객사 이름은 넣지 않는다.
  🚨 카카오톡은 이미지를 가운데 기준으로 잘라(정사각형 등) 보여 줄 때가 있다.
     라벨·윗줄·헤드라인은 가운데 정사각형(가로 285~915px) 안에 둔다. 세 축 줄만 그 밖으로 나간다.
  색은 src/styles.css 의 :root 토큰 값을 그대로 옮겼다.
  폰트: 라틴은 사이트와 같은 Space Grotesk, 한글은 Noto Sans KR(사이트는 한글 폰트를 따로 지정하지 않아
        OS 기본 글꼴로 나오므로, 캡처 환경에 상관없이 같은 결과가 나오게 웹폰트로 고정).
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1200" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@500;700;800&display=block" rel="stylesheet" />
<style>
  :root {
    --background: oklch(0.13 0.04 280);
    --foreground: oklch(0.97 0.01 270);
    --surface: oklch(0.18 0.05 280);
    --primary: oklch(0.58 0.22 280);
    --primary-glow: oklch(0.72 0.2 285);
    --muted-foreground: oklch(0.68 0.04 270);
    --border: oklch(0.28 0.07 280);
    --font: "Space Grotesk", "Noto Sans KR", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background-color: var(--background);
    color: var(--foreground);
    font-family: var(--font);
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  /* 사이트 body 배경과 같은 두 겹 글로우 + 헤드라인 뒤 은은한 원 */
  .glow {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(ellipse 80% 55% at 50% -12%, color-mix(in oklab, var(--primary) 42%, transparent), transparent),
      radial-gradient(ellipse 55% 45% at 85% 105%, color-mix(in oklab, var(--primary-glow) 22%, transparent), transparent),
      radial-gradient(ellipse 45% 40% at 12% 100%, color-mix(in oklab, var(--primary) 16%, transparent), transparent),
      radial-gradient(circle 300px at 50% 52%, color-mix(in oklab, var(--primary) 14%, transparent), transparent);
  }
  /* 홈 히어로의 격자(64px, 가운데로 모이는 마스크) */
  .grid {
    position: absolute; inset: 0;
    opacity: 0.5;
    background-image:
      linear-gradient(to right, var(--border) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: 24px 27px;
    -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 45%, black, transparent);
    mask-image: radial-gradient(ellipse 72% 70% at 50% 45%, black, transparent);
  }
  .wrap {
    position: relative;
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding-bottom: 6px;
  }
  .label {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 18px;
    border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--border) 85%, transparent);
    background: color-mix(in oklab, var(--surface) 60%, transparent);
    font-size: 14px; font-weight: 600; letter-spacing: 0.2em;
    color: var(--muted-foreground);
  }
  .label i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--primary-glow);
    box-shadow: 0 0 10px var(--primary-glow);
  }
  .upper {
    margin-top: 26px;
    font-size: 25px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--primary-glow);
  }
  h1 {
    margin-top: 14px;
    font-size: 84px; line-height: 1.1; font-weight: 800; letter-spacing: -0.035em;
  }
  .grad {
    background: linear-gradient(100deg, color-mix(in oklab, var(--foreground) 45%, var(--primary-glow)) 0%, var(--primary-glow) 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    /* background-clip:text 일 때 글자 끝이 잘리지 않게 */
    padding: 0 0.04em;
  }
  .axes {
    margin-top: 34px;
    display: flex;
    border: 1px solid color-mix(in oklab, var(--border) 75%, transparent);
    border-radius: 16px;
    overflow: hidden;
    background: color-mix(in oklab, var(--border) 50%, transparent);
    gap: 1px;
  }
  .axes div {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 26px;
    background: color-mix(in oklab, var(--background) 85%, transparent);
    font-size: 19px; font-weight: 500; white-space: nowrap;
  }
  .axes b {
    width: 6px; height: 6px; border-radius: 50%; background: var(--primary-glow); flex: none;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <main class="wrap">
    <div class="label"><i></i>AISOLUTION · GROWTH PARTNER</div>
    <p class="upper">AI 기반 데이터 분석 × 통합 미디어 솔루션</p>
    <h1>비즈니스의<br /><span class="grad">스케일</span>을<br />확장합니다</h1>
    <div class="axes">
      <div><b></b>Web/App 플랫폼 구축</div>
      <div><b></b>CRM·Meta Ads 통합 마케팅</div>
      <div><b></b>디지털 사이니지(DOOH) 통합 운영</div>
    </div>
  </main>
</body>
</html>
